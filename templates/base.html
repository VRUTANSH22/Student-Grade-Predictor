<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Student Performance Predictor — ML-powered grade prediction system built with Flask, Random Forest & XGBoost." />
  <title>{% block title %}Student Performance Predictor{% endblock %}</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- App Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

  {% block head_extra %}{% endblock %}
</head>
<body>

<!-- ══════════════════════════════════════════════════════════
     SIDEBAR NAVIGATION
     ══════════════════════════════════════════════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon">🎓</div>
    <div class="brand-text">
      <span class="brand-name">GradeAI</span>
      <span class="brand-sub">Performance Predictor</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="{{ url_for('main.index') }}" class="nav-item {% if request.endpoint == 'main.index' %}active{% endif %}" id="nav-predict">
      <span class="nav-icon">🔮</span>
      <span class="nav-label">Predict</span>
    </a>
    <a href="{{ url_for('main.history_page') }}" class="nav-item {% if request.endpoint == 'main.history_page' %}active{% endif %}" id="nav-history">
      <span class="nav-icon">📋</span>
      <span class="nav-label">History</span>
    </a>
    <a href="{{ url_for('main.dashboard_page') }}" class="nav-item {% if request.endpoint == 'main.dashboard_page' %}active{% endif %}" id="nav-dashboard">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Dashboard</span>
    </a>
    <a href="/apidocs" class="nav-item" id="nav-docs" target="_blank">
      <span class="nav-icon">📖</span>
      <span class="nav-label">API Docs</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="status-dot" id="health-dot" title="System Health"></div>
    <span class="sidebar-footer-text">System Online</span>
  </div>
</aside>

<!-- Hamburger (mobile) -->
<button class="hamburger" id="hamburger" aria-label="Toggle navigation">
  <span></span><span></span><span></span>
</button>

<!-- ══════════════════════════════════════════════════════════
     MAIN CONTENT
     ══════════════════════════════════════════════════════════ -->
<main class="main-content" id="main-content">
  {% block content %}{% endblock %}
</main>

<!-- ══════════════════════════════════════════════════════════
     TOAST NOTIFICATION CONTAINER
     ══════════════════════════════════════════════════════════ -->
<div class="toast-container" id="toast-container" aria-live="polite"></div>

<!-- ══════════════════════════════════════════════════════════
     SCRIPTS
     ══════════════════════════════════════════════════════════ -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
